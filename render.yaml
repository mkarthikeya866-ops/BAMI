services:
  - type: web
    name: xgbioactive
    runtime: python
    plan: free
    buildCommand: chmod +x Backend/bin/* && pip install -r Backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir Backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
