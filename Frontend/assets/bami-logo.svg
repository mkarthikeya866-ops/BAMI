<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <defs>
        <linearGradient id="bami-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7C4DFF" />
            <stop offset="50%" stop-color="#651FFF" />
            <stop offset="100%" stop-color="#53389E" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#651FFF" flood-opacity="0.35"/>
        </filter>
    </defs>
    <!-- Outer benzene ring bonds -->
    <path d="M50 18 L78 34 L78 66 L50 82 L22 66 L22 34 Z" 
          stroke="url(#bami-grad)" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Inner resonant double bond arcs or inner ring -->
    <circle cx="50" cy="50" r="16" stroke="url(#bami-grad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.85" />
    <!-- Hexagon node circles -->
    <circle cx="50" cy="18" r="6" fill="#FFFFFF" stroke="url(#bami-grad)" stroke-width="3.5" filter="url(#glow)"/>
    <circle cx="78" cy="34" r="6" fill="#FFFFFF" stroke="url(#bami-grad)" stroke-width="3.5" filter="url(#glow)"/>
    <circle cx="78" cy="66" r="6" fill="#FFFFFF" stroke="url(#bami-grad)" stroke-width="3.5" filter="url(#glow)"/>
    <circle cx="50" cy="82" r="6" fill="#FFFFFF" stroke="url(#bami-grad)" stroke-width="3.5" filter="url(#glow)"/>
    <circle cx="22" cy="66" r="6" fill="#FFFFFF" stroke="url(#bami-grad)" stroke-width="3.5" filter="url(#glow)"/>
    <circle cx="22" cy="34" r="6" fill="#FFFFFF" stroke="url(#bami-grad)" stroke-width="3.5" filter="url(#glow)"/>
    <!-- Center core node -->
    <circle cx="50" cy="50" r="4" fill="url(#bami-grad)" />
</svg>
